<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F8FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="yB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="60%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>
    <linearGradient id="lG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="60%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
    <linearGradient id="sG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="60%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="bA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
    <filter id="drop">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1565C0" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Transparent background (no fill = transparent PNG when exported) -->

  <!-- Top arc ring -->
  <path d="M 70 220 A 185 185 0 1 1 430 220"
        stroke="url(#aG)" stroke-width="24" fill="none"
        stroke-linecap="round" filter="url(#drop)"/>

  <!-- Speed swoosh lines -->
  <path d="M 58 315 Q 115 400 250 420" stroke="url(#sG)" stroke-width="9"  fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 63 340 Q 122 424 256 438" stroke="url(#sG)" stroke-width="7"  fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M 70 362 Q 130 442 262 454" stroke="url(#sG)" stroke-width="5"  fill="none" stroke-linecap="round" opacity="0.42"/>

  <!-- Bottom swoosh arc -->
  <path d="M 200 436 Q 320 476 432 360"
        stroke="url(#bA)" stroke-width="20" fill="none"
        stroke-linecap="round"/>

  <!-- Y letter -->
  <path d="M 108 80 L 244 272 L 244 400 L 206 400 L 206 285 L 88 108 Z" fill="url(#yB)"/>
  <path d="M 372 80 L 244 272 L 282 272 L 392 108 Z"                    fill="url(#yB)"/>

  <!-- L letter -->
  <path d="M 282 168 L 320 168 L 320 372 L 432 372 L 432 402 L 282 402 Z" fill="url(#lG)"/>

  <!-- Pixel dots -->
  <rect x="396" y="124" width="18" height="18" rx="4" fill="#66BB6A" opacity="0.95"/>
  <rect x="420" y="102" width="14" height="14" rx="3" fill="#66BB6A" opacity="0.7"/>
  <rect x="416" y="122" width="10" height="10" rx="2" fill="#43A047" opacity="0.5"/>
</svg>
